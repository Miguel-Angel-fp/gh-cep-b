name: Frontend CD

on:
  workflow_dispatch: # Esto permite el botón "Run workflow" en GitHub

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Necesario para publicar en GHCR

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ./hangman-front
          push: true
          # La etiqueta será: ghcr.io/tu-usuario/hangman-front:latest
          tags: ghcr.io/${{ github.repository_owner }}/hangman-front:latest
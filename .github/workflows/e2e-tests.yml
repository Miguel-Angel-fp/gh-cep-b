name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Paso nuevo: Instalamos las dependencias manualmente
      - name: Instalar dependencias de E2E
        run: npm install
        working-directory: ./hangman-e2e

      # Ejecutamos Cypress pero le decimos que NO intente instalar nada (install: false)
      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./hangman-e2e
          install: false 
          # Nota: Si tus tests necesitan que la web esté encendida, 
          # aquí faltaría el comando para levantar el front.
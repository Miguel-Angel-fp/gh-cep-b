name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # 1. Instalamos dependencias del frontend para que el comando "start" funcione
      - name: Instalar dependencias del Front
        run: npm install
        working-directory: ./hangman-front

      # 2. Ejecutamos Cypress usando la acción oficial que ya sabe manejar el inicio
      - name: Ejecutar Tests E2E
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./hangman-e2e/e2e
          # Este comando ahora sí funcionará porque hicimos npm install antes
          start: npm start
          wait-on: 'http://localhost:8080'
          wait-on-timeout: 120